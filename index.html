<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Liste de Topics (avec chargement JSON)</title>
    <script type="text/javascript" defer src="/script.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin-top: 40px; color: #333; }

        .hidden { display: none !important; }

        /* Loader */
        #loader {
            margin-top: 100px;
            font-size: 22px;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 6px solid #ddd;
            border-top-color: #007bff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Search box */
        .search-box {
            margin-top: 20px;
            width: 90%;
            max-width: 500px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            transition: 0.2s;
        }

        .search-box input:focus {
            border-color: #007bff;
            box-shadow: 0 2px 10px rgba(0,123,255,0.3);
        }

        /* Topic list */
        .topics {
            margin-top: 30px;
            width: 90%;
            max-width: 600px;
        }

        .topic {
            background: white;
            padding: 15px 20px;
            margin-bottom: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: 0.2s;
        }

        .topic:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .details-wrapper {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.35s ease, opacity 0.3s ease;
            opacity: 0;
        }

        .topic:hover .details-wrapper {
            max-height: 150px;
            opacity: 1;
        }

        .details {
            padding: 10px 5px 0 5px;
            color: #555;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1 class="hidden" id="title">Liste de Topics</h1>

    <div id="loader">
        <div class="spinner"></div>
        Loading...
    </div>

    <div class="search-box hidden" id="searchBox">
        <input type="text" id="searchBar" placeholder="🔍 Rechercher un topic...">
    </div>

    <div class="topics hidden" id="topicsList"></div>

</body>
</html>
